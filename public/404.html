<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found · DropSafe</title>
    <meta name="description" content="The page you requested could not be found. Return to the DropSafe monitoring dashboard." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1f3a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(900px 420px at 12% -8%, rgb(8 145 178 / 0.12), transparent 62%),
          radial-gradient(760px 380px at 100% 0%, rgb(37 99 235 / 0.08), transparent 58%),
          #f4f7fb;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 520px;
        padding: 40px 32px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 24px 60px -32px rgb(11 31 58 / 0.5);
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #0b1f3a;
        font-size: 18px;
        font-weight: 800;
        text-decoration: none;
      }
      .brand svg { border-radius: 9px; }
      .code {
        margin: 28px 0 0;
        font-size: 56px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #0b1f3a;
      }
      h1 { margin: 10px 0 0; font-size: 26px; }
      p.lead {
        margin: 10px auto 0;
        max-width: 38ch;
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 24px;
      }
      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background 150ms ease, transform 150ms ease;
      }
      .actions a:active { transform: scale(0.98); }
      .primary { background: #0b1f3a; color: #fff; }
      .primary:hover { background: #1b3a66; }
      .secondary { border: 1px solid #cbd5e1; background: #fff; color: #0b1f3a; }
      .secondary:hover { background: #f8fafc; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0b1f3a" />
          <path d="M16 5c4 5.2 7 8.6 7 12a7 7 0 0 1-14 0c0-3.4 3-6.8 7-12z" fill="#22d3ee" />
        </svg>
        DropSafe
      </a>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p class="lead">The page you were looking for does not exist or has moved. Head back to the dashboard to continue monitoring.</p>
      <div class="actions">
        <a class="primary" href="/">Back to dashboard</a>
        <a class="secondary" href="/#live">Live monitoring</a>
      </div>
    </main>
  </body>
</html>
